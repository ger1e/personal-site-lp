name: normalize-markdown-schema

on:
  push:
    paths:
      - '.github/workflows/markdown-schema-normalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Normalize all tracked Markdown
        shell: bash
        run: |
          set -euo pipefail
          branch='docs/ger1e-markdown-schema'
          git checkout -B "$branch"
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          repo=Path.cwd().name.upper().replace('-',' ')
          paths=subprocess.check_output(['git','ls-files','*.md'],text=True).splitlines()
          def slug(s):
              s=re.sub(r'<[^>]+>','',s); s=re.sub(r'[`*_~]','',s).lower(); s=re.sub(r'[^a-z0-9\s-]','',s); return re.sub(r'[\s-]+','-',s).strip('-') or 'section'
          for path in paths:
              p=Path(path); text=p.read_text(encoding='utf-8')
              if p.name=='CLAUDE.md' and text.strip().startswith('@') and '\n' not in text.strip():
                  continue
              out=[]; fence=False; first=True; n=0
              for line in text.splitlines():
                  if re.match(r'^\s*(```|~~~)',line): fence=not fence; out.append(line); continue
                  if not fence:
                      m=re.match(r'^(#{1,6})\s+(.+?)\s*#*\s*$',line)
                      if m:
                          title=m.group(2).strip(); a=slug(title)
                          if first:
                              out += [f'<a id="{a}"></a>','<div align="center">','',f'<strong>{title}</strong><br/>',f'<sub>GER1E // {repo} // DOCUMENTATION</sub>','','</div>']; first=False
                          else:
                              n+=1; out += [f'<a id="{a}"></a>',f'<sub><strong>{n:02d} // {title}</strong></sub>']
                          continue
                      if '<img ' in line:
                          def fix(m): return f'width={m.group(1)}100%{m.group(1)}' if int(m.group(2))>360 else m.group(0)
                          line=re.sub(r'width=(["\'])(\d+)\1',fix,line)
                  out.append(line)
              result='\n'.join(out).rstrip()+'\n'; marker='<!-- GER1E-DOC-SCHEMA: v1 -->'
              if not result.startswith(marker): result=marker+'\n'+result
              footer=f'GER1E // {repo} // MOBILE-SAFE DOCUMENTATION'
              if footer not in result: result+=f'\n<p align="center"><sub>{footer}</sub></p>\n'
              p.write_text(result,encoding='utf-8')
          PY
          git rm -f .github/workflows/markdown-schema-normalize.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'No Markdown normalization changes required.'; exit 0; fi
          git commit -m 'docs: normalize all Markdown to GER1E schema'
          git push --force origin HEAD:"$branch"
