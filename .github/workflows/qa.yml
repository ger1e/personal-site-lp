name: QA

on:
  push:
    branches:
      - main
      - pimp-my-git-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Sentry modules
        env:
          SENTRY_DSN: ''
          VERCEL_ENV: preview
        run: node -e "require('./instrument.js'); require('./api/403.js'); require('./api/404.js');"

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit repository
        run: python scripts/qa.py
