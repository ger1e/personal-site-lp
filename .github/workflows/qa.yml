name: QA

on:
  push:
    branches:
      - main
      - pimp-my-git-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate browser runtime syntax
        run: node --check site.js

      - name: Execute Sentry serverless smoke test
        env:
          SENTRY_ENABLED: 'false'
          VERCEL_ENV: preview
        run: |
          node <<'NODE'
          const h403 = require('./api/403.js');
          const h404 = require('./api/404.js');
          const response = () => ({
            statusCode: 0,
            headers: {},
            body: '',
            setHeader(name, value) { this.headers[name] = value; },
            end(body) { this.body = body; },
          });
          const assertResponse = (response, status) => {
            if (response.statusCode !== status) throw new Error(`expected ${status}, got ${response.statusCode}`);
            if (response.headers['Content-Type'] !== 'text/html; charset=utf-8') throw new Error(`${status}: bad content type`);
            if (response.headers['Cache-Control'] !== 'public, max-age=0, must-revalidate') throw new Error(`${status}: bad cache policy`);
            if (response.headers['X-Robots-Tag'] !== 'noindex, nofollow') throw new Error(`${status}: missing noindex`);
            if (!response.body || !response.body.includes(String(status))) throw new Error(`${status}: empty or invalid body`);
          };
          (async () => {
            const r403 = response();
            const r404 = response();
            await h403({ method: 'GET' }, r403);
            await h404({ method: 'GET' }, r404);
            assertResponse(r403, 403);
            assertResponse(r404, 404);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit repository
        run: python scripts/qa_runtime.py
