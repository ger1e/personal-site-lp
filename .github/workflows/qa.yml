name: QA

on:
  push:
    branches:
      - main
      - pimp-my-git-2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Execute Sentry serverless smoke test
        env:
          SENTRY_DSN: ''
          VERCEL_ENV: preview
        run: |
          node <<'NODE'
          const h403 = require('./api/403.js');
          const h404 = require('./api/404.js');
          const response = () => ({
            statusCode: 0,
            headers: {},
            setHeader(name, value) { this.headers[name] = value; },
            end(body) { this.body = body; },
          });
          (async () => {
            const r403 = response();
            const r404 = response();
            await h403({ method: 'GET' }, r403);
            await h404({ method: 'GET' }, r404);
            if (r403.statusCode !== 403 || r404.statusCode !== 404) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Audit repository
        run: python scripts/qa.py
