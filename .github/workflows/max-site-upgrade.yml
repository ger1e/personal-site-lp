name: MAX site upgrade

"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/max-site-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production site metadata and assets
        shell: bash
        run: |
          cat > /tmp/max_upgrade.py <<'PY'
          from pathlib import Path
          import re, json, struct, zlib, binascii
          
          ROOT = Path('.')
          CANON = 'https://gergoilly.hu/'
          DESC = 'Threat hunting, cyber threat intelligence and detection engineering.'
          TITLE = 'ger1e // Threat Hunting · CTI · Detection'
          
          # ---------- Patch index metadata ----------
          p = ROOT / 'index.html'
          html = p.read_text(encoding='utf-8')
          seo = f'''<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
          <meta name="description" content="{DESC}">
          <meta name="author" content="ger1e">
          <meta name="application-name" content="ger1e">
          <meta name="apple-mobile-web-app-title" content="ger1e">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="mobile-web-app-capable" content="yes">
          <meta name="format-detection" content="telephone=no">
          <meta name="msapplication-TileColor" content="#03050a">
          <link rel="canonical" href="{CANON}">
          <link rel="icon" href="/favicon.svg" type="image/svg+xml">
          <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png">
          <link rel="icon" href="/favicon.ico" sizes="any">
          <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
          <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#58dcff">
          <link rel="manifest" href="/site.webmanifest">
          <meta property="og:type" content="website">
          <meta property="og:site_name" content="ger1e">
          <meta property="og:locale" content="en_US">
          <meta property="og:title" content="{TITLE}">
          <meta property="og:description" content="{DESC}">
          <meta property="og:url" content="{CANON}">
          <meta property="og:image" content="{CANON}og-card.png">
          <meta property="og:image:secure_url" content="{CANON}og-card.png">
          <meta property="og:image:type" content="image/png">
          <meta property="og:image:width" content="1200">
          <meta property="og:image:height" content="630">
          <meta property="og:image:alt" content="ger1e — Threat Hunting, CTI and Detection Engineering">
          <meta name="twitter:card" content="summary_large_image">
          <meta name="twitter:title" content="{TITLE}">
          <meta name="twitter:description" content="{DESC}">
          <meta name="twitter:image" content="{CANON}og-card.png">
          <meta name="twitter:image:alt" content="ger1e — Threat Hunting, CTI and Detection Engineering">
          <link rel="preconnect" href="https://open.spotify.com" crossorigin>
          <script type="application/ld+json">{{"@context":"https://schema.org","@type":"ProfilePage","url":"{CANON}","name":"{TITLE}","description":"{DESC}","mainEntity":{{"@type":"Person","name":"ger1e","url":"{CANON}","sameAs":["https://github.com/ger1e"]}}}}</script>
          '''
          pattern = re.compile(r'<meta name="robots"[^>]*>\n<meta name="description"[^>]*>\n(?:<meta property="og:[^\n]+\n|<meta name="twitter:[^\n]+\n)*<meta http-equiv="Content-Security-Policy"[^>]*>\n<link rel="preconnect" href="https://open\.spotify\.com" crossorigin>\n', re.S)
          new_html, n = pattern.subn(seo, html, count=1)
          if n != 1:
              raise SystemExit(f'SEO block patch failed: replacements={n}')
          p.write_text(new_html, encoding='utf-8')
          
          # ---------- Shared error surface ----------
          def error_page(code, label, detail):
              return f'''<!doctype html>
          <html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03050a"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>{code} // {label} // ger1e</title><style>
          *{{box-sizing:border-box}}html,body{{margin:0;min-height:100%;background:#03050a;color:#eefcff;font-family:"Courier New",ui-monospace,monospace}}body{{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 45%,rgba(88,220,255,.09),transparent 32rem),#03050a}}body:before{{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.018) 0 1px,transparent 1px 4px)}}main{{width:min(760px,calc(100% - 32px));border:1px solid rgba(88,220,255,.25);background:rgba(7,11,18,.92);padding:clamp(28px,6vw,64px);box-shadow:0 30px 100px rgba(0,0,0,.5);position:relative}}main:before{{content:"";position:absolute;inset:9px;border:1px solid rgba(88,220,255,.06);pointer-events:none}}.k{{font-size:10px;letter-spacing:.2em;color:#58dcff}}h1{{margin:22px 0 12px;font:italic 900 clamp(62px,15vw,150px)/.72 Impact,Haettenschweiler,"Arial Black",sans-serif;letter-spacing:-.07em;text-shadow:5px 0 rgba(88,220,255,.35),-5px 0 rgba(57,135,255,.34)}}h2{{margin:0;font:italic 900 clamp(24px,5vw,42px)/1 Impact,Haettenschweiler,"Arial Black",sans-serif;text-transform:uppercase}}p{{max-width:560px;color:#8496a3;line-height:1.7;font-size:12px}}nav{{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}}a{{color:#eefcff;text-decoration:none;border:1px solid rgba(88,220,255,.35);padding:12px 15px;background:rgba(57,135,255,.08);font-weight:700;font-size:11px;letter-spacing:.08em}}a:hover,a:focus-visible{{border-color:#58dcff;outline:none;box-shadow:0 0 24px rgba(88,220,255,.12)}}.sig{{position:absolute;right:18px;top:17px;color:#58dcff;font-size:8px;letter-spacing:.14em}}</style></head><body><main><div class="sig">GER1E // EDGE</div><div class="k">// HTTP_{code}</div><h1>{code}</h1><h2>{label}</h2><p>{detail}</p><nav><a href="/">RETURN HOME</a><a href="https://github.com/ger1e" rel="me">ACCESS GIT</a></nav></main></body></html>'''
          
          (ROOT/'403.html').write_text(error_page(403,'ACCESS DENIED','This route is intentionally unavailable from the public surface.'), encoding='utf-8')
          (ROOT/'404.html').write_text(error_page(404,'SIGNAL LOST','The requested route does not exist, was moved, or never belonged on this surface.'), encoding='utf-8')
          
          # Exact-status Vercel functions. Inline the static page at build time so no runtime file dependency exists.
          (ROOT/'api').mkdir(exist_ok=True)
          for code in (403,404):
              body = (ROOT/f'{code}.html').read_text(encoding='utf-8')
              js = "const PAGE=" + json.dumps(body, ensure_ascii=False) + ";\nmodule.exports=(req,res)=>{res.statusCode="+str(code)+";res.setHeader('Content-Type','text/html; charset=utf-8');res.setHeader('Cache-Control','public, max-age=0, must-revalidate');res.setHeader('X-Robots-Tag','noindex, nofollow');res.end(PAGE)};\n"
              (ROOT/'api'/f'{code}.js').write_text(js, encoding='utf-8')
          
          # Catch unknown paths after filesystem; explicit /403 and /404 keep truthful status codes.
          vercel = {
            '$schema':'https://openapi.vercel.sh/vercel.json',
            'routes':[
              {'src':'/(.*)','headers':{
                'X-Content-Type-Options':'nosniff',
                'X-Frame-Options':'DENY',
                'Referrer-Policy':'strict-origin-when-cross-origin',
                'Permissions-Policy':'camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()',
                'Strict-Transport-Security':'max-age=31536000',
                'Content-Security-Policy':"default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: blob:; frame-src https://open.spotify.com https://*.spotify.com; connect-src 'self' https://open.spotify.com https://*.spotify.com; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; manifest-src 'self'; upgrade-insecure-requests"
              },'continue':True},
              {'src':'/og-card.png','headers':{'Cache-Control':'public, max-age=86400, stale-while-revalidate=604800'},'continue':True},
              {'src':'/(favicon\.ico|favicon\.svg|favicon-16x16\.png|favicon-32x32\.png|apple-touch-icon\.png|android-chrome-192x192\.png|android-chrome-512x512\.png|mstile-150x150\.png|safari-pinned-tab\.svg)','headers':{'Cache-Control':'public, max-age=86400'},'continue':True},
              {'src':'/(robots\.txt|sitemap\.xml|site\.webmanifest|browserconfig\.xml)','headers':{'Cache-Control':'public, max-age=3600'},'continue':True},
              {'src':'/403','dest':'/api/403'},
              {'src':'/403\.html','dest':'/api/403'},
              {'src':'/404','dest':'/api/404'},
              {'src':'/404\.html','dest':'/api/404'},
              {'handle':'filesystem'},
              {'src':'/(.*)','dest':'/api/404'}
            ]
          }
          (ROOT/'vercel.json').write_text(json.dumps(vercel, indent=2, ensure_ascii=False)+'\n', encoding='utf-8')
          
          (ROOT/'robots.txt').write_text('User-agent: *\nAllow: /\n\nSitemap: https://gergoilly.hu/sitemap.xml\n', encoding='utf-8')
          (ROOT/'sitemap.xml').write_text('''<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://gergoilly.hu/</loc>
              <lastmod>2026-08-21</lastmod>
              <changefreq>monthly</changefreq>
              <priority>1.0</priority>
            </url>
          </urlset>
          ''', encoding='utf-8')
          manifest = {
            'name':'ger1e // Threat Hunting · CTI · Detection',
            'short_name':'ger1e',
            'description':DESC,
            'start_url':'/', 'scope':'/', 'display':'standalone',
            'background_color':'#03050a','theme_color':'#03050a',
            'icons':[
              {'src':'/android-chrome-192x192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'/android-chrome-512x512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
            ]
          }
          (ROOT/'site.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (ROOT/'browserconfig.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <browserconfig><msapplication><tile><square150x150logo src="/mstile-150x150.png"/><TileColor>#03050a</TileColor></tile></msapplication></browserconfig>
          ''', encoding='utf-8')
          
          favicon_svg='''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="#03050a"/><path fill="#3987ff" d="M10 13h30v7H18v24h16v-7H26v-7h17v21H10z" opacity=".75"/><path fill="#58dcff" d="M13 10h30v7H20v24h16v-7h-8v-7h17v21H13z"/><path fill="#eefcff" d="M48 11h6v37h-6zM45 11h12v6H45zM45 42h12v6H45z"/><path fill="#59ff9b" d="M8 53h26v2H8z" opacity=".7"/></svg>'''
          (ROOT/'favicon.svg').write_text(favicon_svg, encoding='utf-8')
          (ROOT/'safari-pinned-tab.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path d="M10 10h34v8H20v24h16v-8h-9v-8h19v24H10V10zm39 0h7v40h-7V10z"/></svg>''', encoding='utf-8')
          
          # ---------- PNG/ICO generation (stdlib only) ----------
          FONT={
          'G':['01110','10000','10000','10111','10001','10001','01110'],
          'E':['11111','10000','10000','11110','10000','10000','11111'],
          'R':['11110','10001','10001','11110','10100','10010','10001'],
          '1':['00100','01100','00100','00100','00100','00100','01110'],
          'H':['10001','10001','10001','11111','10001','10001','10001'],
          'U':['10001','10001','10001','10001','10001','10001','01110'],
          'N':['10001','11001','10101','10011','10001','10001','10001'],
          'T':['11111','00100','00100','00100','00100','00100','00100'],
          'C':['01110','10001','10000','10000','10000','10001','01110'],
          'I':['11111','00100','00100','00100','00100','00100','11111'],
          'D':['11110','10001','10001','10001','10001','10001','11110'],
          'O':['01110','10001','10001','10001','10001','10001','01110'],
          'L':['10000','10000','10000','10000','10000','10000','11111'],
          'Y':['10001','10001','01010','00100','00100','00100','00100'],
          '.':['00000','00000','00000','00000','00000','00110','00110'],
          '/':['00001','00010','00100','01000','10000','00000','00000'],
          ' ':['00000']*7
          }
          
          def canvas(w,h,bg=(3,5,10,255)):
              return [bytearray(bg*w) for _ in range(h)]
          
          def rect(rows,x0,y0,x1,y1,c):
              w=len(rows[0])//4; h=len(rows)
              x0=max(0,x0); y0=max(0,y0); x1=min(w,x1); y1=min(h,y1)
              px=bytes(c)
              for y in range(y0,y1):
                  row=rows[y]
                  for x in range(x0,x1): row[x*4:x*4+4]=px
          
          def text(rows,s,x,y,scale,c,spacing=1):
              ox=x
              for ch in s:
                  pat=FONT.get(ch, FONT[' '])
                  for yy,line in enumerate(pat):
                      for xx,v in enumerate(line):
                          if v=='1': rect(rows,x+xx*scale,y+yy*scale,x+(xx+1)*scale,y+(yy+1)*scale,c)
                  x += (5+spacing)*scale
              return x-ox
          
          def encode_rows(rows):
              h=len(rows); w=len(rows[0])//4
              raw=b''.join(b'\x00'+bytes(r) for r in rows)
              def chunk(t,d): return struct.pack('>I',len(d))+t+d+struct.pack('>I',binascii.crc32(t+d)&0xffffffff)
              return b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
          
          def icon(size):
              rows=canvas(size,size)
              step=max(8,size//8)
              for v in range(step,size,step):
                  rect(rows,v,0,v+1,size,(15,39,55,255)); rect(rows,0,v,size,v+1,(15,39,55,255))
              sc=max(2,size//48); label='G1'; tw=len(label)*6*sc-sc
              x=(size-tw)//2; y=(size-7*sc)//2
              text(rows,label,x+max(1,sc//2),y,sc,(57,135,255,210))
              text(rows,label,x,y-max(1,sc//3),sc,(88,220,255,255))
              rect(rows,size//8,size*7//8,size*6//8,size*7//8+max(1,size//64),(89,255,155,220))
              return encode_rows(rows)
          
          pngs={}
          for size,name in [(16,'favicon-16x16.png'),(32,'favicon-32x32.png'),(150,'mstile-150x150.png'),(180,'apple-touch-icon.png'),(192,'android-chrome-192x192.png'),(512,'android-chrome-512x512.png')]:
              data=icon(size); (ROOT/name).write_bytes(data); pngs[size]=data
          
          imgs=[(16,pngs[16]),(32,pngs[32])]
          header=struct.pack('<HHH',0,1,len(imgs)); offset=6+16*len(imgs); entries=[]; payload=b''
          for size,data in imgs:
              entries.append(struct.pack('<BBBBHHII',size,size,0,0,1,32,len(data),offset)); payload+=data; offset+=len(data)
          (ROOT/'favicon.ico').write_bytes(header+b''.join(entries)+payload)
          
          w,h=1200,630; rows=canvas(w,h)
          for x in range(0,w,60): rect(rows,x,0,x+1,h,(10,28,40,255))
          for y in range(0,h,60): rect(rows,0,y,w,y+1,(10,28,40,255))
          rect(rows,72,70,1128,560,(5,10,17,245)); rect(rows,72,70,1128,72,(88,220,255,255)); rect(rows,72,558,1128,560,(57,135,255,220))
          text(rows,'GER1E',119,167,27,(57,135,255,190)); text(rows,'GER1E',108,155,27,(88,220,255,255))
          text(rows,'HUNT // CTI // DETECT',112,400,8,(238,252,255,255))
          text(rows,'GERGOILLY.HU',112,487,5,(89,255,155,235))
          (ROOT/'og-card.png').write_bytes(encode_rows(rows))
          
          (ROOT/'README.md').write_text('''# personal-site-lp
          
          Canonical source for https://gergoilly.hu/.
          
          Static landing page, branded HTTP error surfaces, SEO/discovery files, PWA/favicon assets, and Vercel production configuration.
          ''', encoding='utf-8')
          
          # ---------- QA ----------
          html=(ROOT/'index.html').read_text(encoding='utf-8')
          required=[
           '<link rel="canonical" href="https://gergoilly.hu/">',
           '<meta property="og:image" content="https://gergoilly.hu/og-card.png">',
           '<meta name="twitter:card" content="summary_large_image">',
           '<link rel="manifest" href="/site.webmanifest">'
          ]
          for needle in required:
              if needle not in html: raise SystemExit(f'missing {needle}')
          for f in ['403.html','404.html','robots.txt','sitemap.xml','site.webmanifest','vercel.json','favicon.svg','favicon.ico','favicon-16x16.png','favicon-32x32.png','apple-touch-icon.png','android-chrome-192x192.png','android-chrome-512x512.png','mstile-150x150.png','safari-pinned-tab.svg','browserconfig.xml','og-card.png','api/403.js','api/404.js']:
              if not (ROOT/f).is_file() or (ROOT/f).stat().st_size==0: raise SystemExit(f'missing/empty {f}')
          json.loads((ROOT/'vercel.json').read_text()); json.loads((ROOT/'site.webmanifest').read_text())
          assert (ROOT/'og-card.png').read_bytes()[:8] == b'\x89PNG\r\n\x1a\n'
          assert (ROOT/'favicon.ico').read_bytes()[:4] == b'\x00\x00\x01\x00'
          print('MAX site upgrade QA passed')
          PY
          python /tmp/max_upgrade.py
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool vercel.json >/dev/null
          python -m json.tool site.webmanifest >/dev/null
          grep -F '<link rel="canonical" href="https://gergoilly.hu/">' index.html >/dev/null
          grep -F 'https://gergoilly.hu/og-card.png' index.html >/dev/null
          grep -F 'Sitemap: https://gergoilly.hu/sitemap.xml' robots.txt >/dev/null
          grep -F '<loc>https://gergoilly.hu/</loc>' sitemap.xml >/dev/null
          test "$(head -c 8 og-card.png | xxd -p)" = '89504e470d0a1a0a'
          test "$(head -c 4 favicon.ico | xxd -p)" = '00000100'
      - name: Commit upgrade and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/max-site-upgrade.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git diff --cached --check
          git commit -m 'site: MAX production metadata and error surfaces'
          git push
