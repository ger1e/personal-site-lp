name: cat-hero

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-hero-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cat-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply managed cat hero override
        run: python scripts/promote_cat.py --write
      - name: Test and audit
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/qa.py
          python -m py_compile scripts/promote_cat.py
          git diff --check
      - name: Commit managed hero change
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'site: promote cat to primary hero'
          git push
