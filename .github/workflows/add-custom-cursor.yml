name: Add custom cyber cursor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-custom-cursor.yml'

permissions:
  contents: write

jobs:
  install-cursor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install themed cursor assets
        shell: python
        run: |
          from pathlib import Path
          cursor_css = r'''/* ger1e cyber cursor system — desktop/fine pointers only */
          @media (hover:hover) and (pointer:fine) {
            html, body, main, section, figure, nav, .hero-card, .cat-card, .spotify { cursor: url('/cursor-reticle.svg') 16 16, crosshair; }
            a, button, .btn, [role='button'], summary, label { cursor: url('/cursor-lock.svg') 16 16, pointer; }
            input, textarea, [contenteditable='true'] { cursor: url('/cursor-text.svg') 16 16, text; }
          }
          '''
          reticle = '''<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g fill="none" stroke-linecap="square"><circle cx="16" cy="16" r="8.5" stroke="#58dcff" stroke-width="1.2" opacity=".9"/><circle cx="16" cy="16" r="3" stroke="#a5f2ff" stroke-width="1" opacity=".9"/><path d="M16 2v7M16 23v7M2 16h7M23 16h7" stroke="#58dcff" stroke-width="1.4"/><path d="M5.5 5.5l3.2 3.2M23.3 23.3l3.2 3.2M26.5 5.5l-3.2 3.2M8.7 23.3l-3.2 3.2" stroke="#3987ff" stroke-width="1" opacity=".9"/></g><circle cx="16" cy="16" r="1.35" fill="#eefcff"/><circle cx="16" cy="16" r=".55" fill="#59ff9b"/></svg>'''
          lock = '''<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g fill="none"><path d="M7 3H3v4M25 3h4v4M29 25v4h-4M7 29H3v-4" stroke="#58dcff" stroke-width="1.8"/><circle cx="16" cy="16" r="8" stroke="#3987ff" stroke-width="1.1"/><path d="M16 6v6M16 20v6M6 16h6M20 16h6" stroke="#a5f2ff" stroke-width="1.2"/></g><circle cx="16" cy="16" r="2" fill="#59ff9b"/><circle cx="16" cy="16" r=".8" fill="#eefcff"/></svg>'''
          text_cursor = '''<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g fill="none"><path d="M12 5h8M16 5v22M12 27h8" stroke="#a5f2ff" stroke-width="1.8"/><path d="M8 9h4M20 9h4M8 23h4M20 23h4" stroke="#3987ff" stroke-width="1" opacity=".9"/><path d="M14 14h4M14 18h4" stroke="#59ff9b" stroke-width="1.2"/></g></svg>'''
          Path('cursor.css').write_text(cursor_css, encoding='utf-8')
          Path('cursor-reticle.svg').write_text(reticle, encoding='utf-8')
          Path('cursor-lock.svg').write_text(lock, encoding='utf-8')
          Path('cursor-text.svg').write_text(text_cursor, encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8'); anchor='<link rel="manifest" href="/site.webmanifest">'
          if '/cursor.css' not in s: assert s.count(anchor)==1; p.write_text(s.replace(anchor,anchor+'\n<link rel="stylesheet" href="/cursor.css">'),encoding='utf-8')
          for name in ('403.html','404.html'):
              p=Path(name); s=p.read_text(encoding='utf-8'); anchor='<link rel="icon" href="/favicon.svg" type="image/svg+xml">'
              if '/cursor.css' not in s: assert s.count(anchor)==1; p.write_text(s.replace(anchor,anchor+'<link rel="stylesheet" href="/cursor.css">'),encoding='utf-8')
          for name in ('api/403.js','api/404.js'):
              p=Path(name); s=p.read_text(encoding='utf-8'); anchor='<link rel=\\"icon\\" href=\\"/favicon.svg\\" type=\\"image/svg+xml\\">'
              if '/cursor.css' not in s: assert s.count(anchor)==1; p.write_text(s.replace(anchor,anchor+'<link rel=\\"stylesheet\\" href=\\"/cursor.css\\">'),encoding='utf-8')
          p=Path('vercel.json'); s=p.read_text(encoding='utf-8'); old="style-src 'unsafe-inline';"; new="style-src 'self' 'unsafe-inline';"
          if new not in s: assert s.count(old)==1; p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Verify cursor package
        shell: bash
        run: |
          set -euo pipefail
          test -s cursor.css
          test -s cursor-reticle.svg
          test -s cursor-lock.svg
          test -s cursor-text.svg
          grep -q '/cursor.css' index.html
          grep -q '/cursor.css' 403.html
          grep -q '/cursor.css' 404.html
          grep -q "style-src 'self' 'unsafe-inline'" vercel.json
          python scripts/qa.py
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit final cursor system and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-custom-cursor.yml
          git add index.html 403.html 404.html api/403.js api/404.js vercel.json cursor.css cursor-reticle.svg cursor-lock.svg cursor-text.svg
          git commit -m 'site: add cyber target cursor system'
          git push
