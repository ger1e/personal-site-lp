name: Bootstrap personal site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-site.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified canonical site
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            https://raw.githubusercontent.com/ger1e/landing-pages/main/index.html \
            -o index.html
          expected='636ab3cb45e56f0043c6046690b0ee62c5001196'
          actual="$(git hash-object index.html)"
          echo "index_blob=$actual"
          test "$actual" = "$expected"
          cat > README.md <<'EOF'
          # personal-site-lp
          Personal landing page.
          EOF
      - name: Commit clean site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/bootstrap-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add -A
          git commit -m 'site: publish canonical personal landing page'
          git push origin HEAD:main
